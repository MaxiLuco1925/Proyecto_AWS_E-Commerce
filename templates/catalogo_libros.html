{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Mi E-commerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Libros</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="hero-section mb-5 text-center">
            <h1 class="display-5 fw-bold text-gold">{{ category_title }}</h1>
            <p class="lead text-light-custom">{{ category_description }}</p>
        </div>

        <div class="row g-4 justify-content-center">
            {% for sub in subcategorias %}
            <div class="col-12 col-md-6 col-xl-3 d-flex">
                <div class="category-card h-100 d-flex flex-column justify-content-between w-100">
                    <div>
                        <h4 class="fw-bold">{{ sub.nombre }}</h4>
                        <p class="text-muted mb-4">{{ sub.descripcion }}</p>
                    </div>
                    <button class="btn btn-custom mt-auto">Ver {{ sub.nombre }}</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer class="py-4 mt-5 text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 Mi E-commerce AWS. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
